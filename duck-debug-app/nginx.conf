server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  # Reverse proxy to the backend container. "duck-api" is the compose service
  # name, which is also its DNS name inside the project network, and 8080 is the
  # port the api listens on inside its own container.
  location /api {
    proxy_pass http://duck-api:8080/api;
  }

  # Serve the app for any other path, so a reload does not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
