# An explicit project name. Without it Compose derives the name from the folder,
# and every DNS name and container name changes when the folder is renamed.
name: duck-debug

services:
  duck-api:
    restart: on-failure
    build: ./duck-api
    # The api listens on 8080 inside the container and does not need to be
    # published - the frontend reaches it over the project network by its
    # service name. Uncomment while debugging to reach it from the host.
    # ports:
    #   - "8091:8080"

  # The frontend belongs here. See task 3.
